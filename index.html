
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NANO BOT</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #071323;
  color: #45DDF5;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 25px 15px;
}

.container {
  max-width: 480px;
  margin: 35px auto;
  background: #102238;
  padding: 28px;
  border-radius: 22px;
}

h1 {
  letter-spacing: 5px;
  font-size: 36px;
}

.subtitle {
  color: #45DDF5;
  margin-bottom: 25px;
}

input, textarea {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  font-size: 17px;
  margin: 10px 0;
  outline: none;
}

button {
  background: #0786AD;
  color: white;
  border: none;
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #079CC6;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* LOGIN */

#loginPage {
  text-align: center;
}

.passwordBox {
  display: flex;
  align-items: center;
  background: white;
  border-radius: 12px;
  margin: 10px 0;
}

.passwordBox input {
  margin: 0;
}

.passwordBox button {
  background: transparent;
  color: #333;
  padding: 12px;
  font-size: 20px;
}

#loginButton {
  width: 100%;
  margin-top: 15px;
}

/* CONTROLLER */

#controllerPage {
  display: none;
}

.topBar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  text-align: left;
  gap: 10px;
}

.userDetails {
  display: flex;
  align-items: center;
  gap: 10px;
}

.userIcon {
  font-size: 27px;
}

.userName {
  color: white;
  font-weight: bold;
}

.userStatus {
  color: #35E5A1;
  font-size: 13px;
  margin-top: 4px;
}

.logoutButton {
  background: #17304A;
  color: #45DDF5;
  padding: 12px;
  font-size: 20px;
}

.botTitle {
  text-align: center;
}

#connectionStatus {
  font-weight: bold;
  margin: 15px 0 30px;
}

.connected {
  color: #35E5A1;
}

.disconnected {
  color: #FF6868;
}

/* MESSAGE AREA */

.messageRow {
  display: flex;
  align-items: stretch;
  gap: 8px;
}

.messageRow textarea {
  flex: 1;
  height: 100px;
  resize: none;
  margin: 0;
}

.micButton {
  width: 58px;
  min-width: 58px;
  font-size: 24px;
  padding: 10px;
}

.sendButton {
  width: 100%;
  margin-top: 15px;
}

#status {
  color: white;
  min-height: 25px;
  margin-top: 20px;
}

@media (max-width: 480px) {
  .container {
    padding: 22px 18px;
    margin-top: 15px;
  }

  h1 {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN PAGE -->

  <div id="loginPage">

    <h1>NANO BOT</h1>
    <p class="subtitle">YOUR PERSONAL DESK ASSISTANT</p>

    <input
      type="text"
      id="mqttUsername"
      placeholder="Username"
      autocomplete="username"
    >

    <div class="passwordBox">
      <input
        type="password"
        id="mqttPassword"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        type="button"
        onclick="togglePassword()"
        id="passwordToggle"
        title="Show password"
      >👁️</button>
    </div>

    <button id="loginButton" onclick="connectMQTT()">
      LOGIN
    </button>

    <p id="loginStatus"></p>

  </div>


  <!-- MAIN CONTROLLER -->

  <div id="controllerPage">

    <div class="topBar">

      <div class="userDetails">
        <span class="userIcon">👤</span>

        <div>
          <div class="userName" id="displayUsername">
            User
          </div>

          <div class="userStatus">
            ● Connected
          </div>
        </div>
      </div>

      <button
        class="logoutButton"
        onclick="logout()"
        title="Logout"
      >
        ↪
      </button>

    </div>


    <div class="botTitle">

      <h1>NANO BOT</h1>

      <p class="subtitle">
        YOUR PERSONAL DESK ASSISTANT
      </p>

      <p id="connectionStatus" class="connected">
        ● MQTT CONNECTED
      </p>

    </div>


    <!-- MESSAGE INPUT + MICROPHONE -->

    <div class="messageRow">

      <textarea
        id="message"
        placeholder="Type your message to NANO BOT..."
      ></textarea>

      <button
        class="micButton"
        onclick="startListening()"
        title="Voice input"
      >
        🎙️
      </button>

    </div>


    <button
      id="sendButton"
      class="sendButton"
      onclick="sendMessage()"
    >
      SEND MESSAGE
    </button>

    <p id="status">
      Ready to communicate.
    </p>

  </div>

</div>


<script>

// MQTT SETTINGS

const brokerURL = "wss://broker.mqtty.com:8884/mqtt";

const commandTopic = "nano-esp32/command";
const responseTopic = "nano-esp32/response";

let mqttClient = null;
let messageWaitingForResponse = false;


// LOGIN / CONNECT

function connectMQTT() {

  const username =
    document.getElementById("mqttUsername").value.trim();

  const password =
    document.getElementById("mqttPassword").value;

  const loginStatus =
    document.getElementById("loginStatus");

  if (!username || !password) {
    loginStatus.textContent =
      "Please enter username and password.";
    return;
  }

  loginStatus.textContent = "Connecting to NANO BOT...";

  const clientId =
    "NanoBotWeb-" + Math.random().toString(16).slice(2, 10);

  mqttClient = mqtt.connect(brokerURL, {
    username: username,
    password: password,
    clientId: clientId,
    protocolVersion: 4,
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 0
  });


  mqttClient.on("connect", function() {

    mqttClient.subscribe(responseTopic, function(error) {

      if (error) {
        loginStatus.textContent =
          "Response subscription failed.";
        return;
      }

      // Show controller after connection and subscription

      document.getElementById("loginPage").style.display =
        "none";

      document.getElementById("controllerPage").style.display =
        "block";

      document.getElementById("displayUsername").textContent =
        username;

      document.getElementById("connectionStatus").textContent =
        "● MQTT CONNECTED";

      document.getElementById("connectionStatus").className =
        "connected";

      document.getElementById("status").textContent =
        "Ready to communicate.";

    });

  });


  // RECEIVE NANO BOT RESPONSE

  mqttClient.on("message", function(topic, payload) {

    if (topic === responseTopic && messageWaitingForResponse) {

      messageWaitingForResponse = false;

      document.getElementById("status").textContent =
        "🤖 NanoBot received your message!";

    }

  });


  // MQTT ERROR

  mqttClient.on("error", function(error) {

    loginStatus.textContent =
      "Connection error: " + error.message;

  });


  // CONNECTION CLOSED

  mqttClient.on("close", function() {

    if (document.getElementById("controllerPage").style.display === "block") {

      document.getElementById("connectionStatus").textContent =
        "● DISCONNECTED";

      document.getElementById("connectionStatus").className =
        "disconnected";

      document.getElementById("status").textContent =
        "Connection lost. Please login again.";

    }

  });

}


// SHOW / HIDE PASSWORD

function togglePassword() {

  const passwordInput =
    document.getElementById("mqttPassword");

  const toggleButton =
    document.getElementById("passwordToggle");

  if (passwordInput.type === "password") {

    passwordInput.type = "text";
    toggleButton.textContent = "🙈";
    toggleButton.title = "Hide password";

  } else {

    passwordInput.type = "password";
    toggleButton.textContent = "👁️";
    toggleButton.title = "Show password";

  }

}


// SEND MESSAGE

function sendMessage() {

  const message =
    document.getElementById("message").value.trim();

  const status =
    document.getElementById("status");

  if (!message) {
    status.textContent = "Please enter a message.";
    return;
  }

  if (!mqttClient || !mqttClient.connected) {
    status.textContent = "MQTT is disconnected.";
    return;
  }

  status.textContent = "Sending message to NANO BOT...";

  messageWaitingForResponse = true;

  mqttClient.publish(
    commandTopic,
    message,
    { qos: 0 },
    function(error) {

      if (error) {

        messageWaitingForResponse = false;

        status.textContent =
          "Message sending failed.";

      } else {

        document.getElementById("message").value = "";

      }

    }
  );

}


// VOICE INPUT

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const status =
    document.getElementById("status");

  if (!SpeechRecognition) {

    status.textContent =
      "Speech recognition is not supported.";

    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = function() {

    status.textContent = "Listening...";

  };

  recognition.onresult = function(event) {

    let transcript = "";

    for (let i = 0; i < event.results.length; i++) {

      transcript +=
        event.results[i][0].transcript;

    }

    document.getElementById("message").value =
      transcript;

    if (event.results[event.results.length - 1].isFinal) {

      status.textContent = "Message ready to send.";

    }

  };

  recognition.onerror = function(event) {

    status.textContent =
      "Voice input error: " + event.error;

  };

  recognition.start();

}


// LOGOUT

function logout() {

  messageWaitingForResponse = false;

  if (mqttClient) {

    mqttClient.end(true);
    mqttClient = null;

  }

  document.getElementById("controllerPage").style.display =
    "none";

  document.getElementById("loginPage").style.display =
    "block";

  document.getElementById("mqttPassword").value = "";

  document.getElementById("mqttUsername").value = "";

  document.getElementById("loginStatus").textContent =
    "Logged out successfully.";

  document.getElementById("message").value = "";

}

</script>

</body>
</html>
